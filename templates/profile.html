{% extends "base.html" %}{% block title %}Profile — FinAI{% endblock %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACCOUNT</div><h1>Profile</h1><p class="muted">Update your personal finance preferences.</p></div></div><section class="panel narrow"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="name" value="{{ current_user.name }}" required></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>Monthly income target (₹)<input type="number" name="monthly_income_target" min="0" step="0.01" value="{{ current_user.monthly_income_target or 0 }}"></label><button class="btn primary">Save profile</button></form></section>{% endblock %}
